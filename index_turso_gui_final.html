<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OFTABAL – PLATBY</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{--bg:#eef4f6;--card:#fff;--ink:#14343a;--muted:#6b7c80;--line:#d8e3e6;--accent:#1d7b8c;--accent2:#2f5f68;--danger:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eef4f6,#f8fbfc);color:#1b2528}
.wrap{max-width:900px;margin:18px auto 40px;padding:0 14px}.card{background:#fff;border:1px solid #dde8eb;border-radius:26px;box-shadow:0 14px 36px rgba(17,52,58,.08);padding:22px}
.header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}.brand h1{font-size:23px;color:var(--ink);margin:0}.brand small{color:var(--muted)}
.modebar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 20px}.mode{padding:17px;border:1px solid var(--line);border-radius:18px;background:#fff;font-size:18px;font-weight:800;color:var(--ink);cursor:pointer}.mode.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:5px}label{font-size:13px;font-weight:700;color:#40545a}input,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);font-size:16px;background:#fff;outline:none}input[readonly]{background:#f3f7f8;font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:15px}.pay{width:100%;padding:18px;border:0;border-radius:18px;font-size:19px;font-weight:800;cursor:pointer;color:#fff;box-shadow:0 10px 24px rgba(17,52,58,.12)}.cash{background:linear-gradient(135deg,#50575a,#2e3335)}.qr{background:linear-gradient(135deg,#1f7a8c,#23515a)}
.account{text-align:center;padding:8px 12px;border-radius:11px;margin-bottom:14px;background:#d1fae5;color:#065f46;font-weight:700;font-size:13px}.account.warning{background:#fee2e2;color:#991b1b}
.recent-link{display:inline-flex;align-items:center;gap:6px;margin-top:17px;border:0;background:none;color:var(--accent);font-weight:800;font-size:14px;cursor:pointer;padding:4px 0}.recent{display:none;margin-top:8px;border:1px solid #e2ebee;border-radius:16px;overflow:hidden;background:#fbfdfe}.recent.show{display:block}.recent-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid #ebf1f3}.recent-row:last-child{border-bottom:0}.recent-main{font-size:13px;line-height:1.45}.muted{color:var(--muted);font-size:12px}.del{background:#fff;color:var(--danger);border:1px solid #fecaca;border-radius:10px;padding:8px 10px;font-weight:700;cursor:pointer}
.bottom{display:flex;justify-content:flex-end;margin-top:18px;padding-top:12px;border-top:1px solid #edf2f3}.admin{background:#fff;color:#52666b;border:1px solid var(--line);border-radius:12px;padding:9px 13px;cursor:pointer;font-weight:700}
.status{display:none;text-align:center;padding:8px 12px;border-radius:11px;margin-bottom:12px;font-weight:700;background:#fee2e2;color:#991b1b}
.overlay{position:fixed;inset:0;background:rgba(8,17,20,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.overlay.show{display:flex}.modal{width:min(760px,100%);background:#fff;border-radius:25px;box-shadow:0 22px 60px rgba(0,0,0,.28);overflow:hidden;max-height:92vh}.modal-head{padding:15px 18px;background:linear-gradient(135deg,var(--ink),#26484f);color:#fff;display:flex;justify-content:space-between;align-items:center}.modal-body{padding:18px;overflow:auto;max-height:78vh}.close{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:8px 11px;cursor:pointer}
.qrbox{text-align:center}.qrcode{width:230px;height:230px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:#fff;padding:14px;border-radius:20px}.big{font-size:36px;font-weight:800;color:var(--ink)}.summary{margin:12px auto;max-width:430px;text-align:left}.sumrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #ddd}
.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.yes{background:var(--danger);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:800;cursor:pointer}.no{background:#e5e7eb;color:#111827;border:0;border-radius:12px;padding:13px;font-weight:800;cursor:pointer}
.admin-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.soft{background:#eef3f5;color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:10px;cursor:pointer}.history{margin-top:12px;border:1px solid #e2ebee;border-radius:15px;overflow:auto}.histrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #eee;font-size:12px}.histrow:last-child{border-bottom:0}
@media(max-width:650px){.grid,.modebar,.actions,.admin-actions{grid-template-columns:1fr}.full{grid-column:auto}.header{align-items:flex-start}.brand h1{font-size:20px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="header"><div class="brand"><div class="logo">OF</div><div><h1>OFTABAL s.r.o.</h1></div></div></div>
<div id="status" class="status"></div>
<div id="account" class="account"></div>
<section id="mainSection">
<div class="grid">
<div class="field full"><label>Pacient</label><input id="qPatient" placeholder="Jméno a příjmení"></div>
<div class="field full"><label>Poznámka</label><input id="qNote" placeholder="ZP / adresa / RČ / poznámka"></div>
<div class="field"><label>Výkon</label><select id="qService" onchange="recalc('q')"><option value="OCT 1000|1000">OCT 1000 Kč</option><option value="OCT 500|500">OCT 500 Kč</option><option value="Jiný|">Jiný výkon</option></select></div>
<div class="field"><label>Částka</label><input id="qAmount" readonly inputmode="numeric"></div>
</div>
<div class="actions"><button class="pay qr" onclick="startQr('NOW')">QR</button><button class="pay cash" onclick="cashPayUnified()">HOTOVĚ</button></div>
<button class="recent-link" onclick="toggleRecent('qr')"><span id="qrArrow">›</span> Poslední 3 transakce</button>
<div id="qrRecent" class="recent"></div>
</section>
<div class="bottom"><button class="admin" onclick="openAdmin()">🔒 Správa / Setup</button></div>
</div></div>

<div class="overlay" id="confirmOverlay"><div class="modal" style="max-width:480px"><div class="modal-head"><b>Smazat transakci?</b><button class="close" onclick="closeConfirm()">Zavřít</button></div><div class="modal-body"><div id="confirmText"></div><div class="confirm-actions"><button class="yes" onclick="confirmDelete()">ANO, SMAZAT</button><button class="no" onclick="closeConfirm()">NE</button></div></div></div></div>

<div class="overlay" id="qrOverlay"><div class="modal"><div class="modal-head"><b id="qrTitle">QR platba</b><button class="close" onclick="closeQr()">Zavřít</button></div><div class="modal-body qrbox"><div id="qrcode" class="qrcode"></div><div id="qrAmount" class="big"></div><div id="qrVs"></div><div class="summary"><div class="sumrow"><span>Pacient</span><b id="qrPatient"></b></div><div class="sumrow"><span>Výkon</span><b id="qrService"></b></div><div class="sumrow"><span>Částka</span><b id="qrAmount2"></b></div><div class="sumrow"><span>VS</span><b id="qrVs2"></b></div><div class="sumrow" id="dueRow"><span>Splatnost</span><b id="qrDue"></b></div></div><div>Vyšetření nehrazené z veřejného zdravotního pojištění</div><button id="qrConfirm" class="pay qr" style="margin-top:14px" onclick="confirmQr()">Zaplaceno</button></div></div></div>

<div class="overlay" id="adminOverlay"><div class="modal"><div class="modal-head"><b>Správa</b><button class="close" onclick="closeAdmin()">Zavřít</button></div><div class="modal-body">
<div id="pinBox"><label>PIN</label><input id="pin" type="password" inputmode="numeric"><button class="soft" onclick="unlockAdmin()">Odemknout</button><div id="pinMsg" class="muted"></div></div>
<div id="adminBox" style="display:none"><div class="admin-actions"><button class="soft" onclick="adminHistory('cash')">Historie hotovost</button><button class="soft" onclick="adminHistory('qr')">Historie QR</button><button class="soft" onclick="exportCsv('cash')">CSV hotovost</button><button class="soft" onclick="exportCsv('qr')">CSV QR</button><button class="soft" onclick="cashBook()">Pokladní kniha</button><button class="soft" onclick="openSetup()">Setup IBAN</button><button class="soft" onclick="backupQr()">Záloha QR</button><button class="soft" onclick="exportQrZip()">ZIP QR</button></div><div id="adminHistory" class="history"></div></div>
</div></div></div>

<div class="overlay" id="setupOverlay"><div class="modal" style="max-width:500px"><div class="modal-head"><b>Setup IBAN</b><button class="close" onclick="closeSetup()">Zavřít</button></div><div class="modal-body"><label>IBAN</label><input id="iban"><button class="soft" onclick="saveSetup()">Uložit</button></div></div></div>

<script>
const TURSO_URL="https://forvision-oftabal.aws-eu-west-1.turso.io",TURSO_TOKEN="eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODY2ODk5ODQsImlkIjoiMDE5ZmZlZjMtNTcwMS03ZWVkLTgxNzMtNjY5NDQ4ODJlZDNkIiwia2lkIjoicm1mdG01TUZZNllRTGs4QXR1TGRnQzRENGlmTDFidFhnSWxlSXF0OU9xZyIsInJpZCI6ImUwODJlZWY1LTVkZDAtNDhhYi1hMDQxLWMxOGU0NWY4N2IzNSJ9.PejDY9gy9YD7DpvD7Xck6tbYTP4SFUYMO3ztnw1nUN31lhkOVi22Js97bhSAbejiNJI7aRa85YTzr0zPcvEOAQ",PIN="1815";
const DEFAULT_ACCOUNT="2846390339 / 0800",DEFAULT_IBAN="CZ5408000000002846390339",SETTINGS_KEY="oftabal_v20_ultimate_settings";
const Q_BACKUP="oftabal_qr_local_backup_v22",Q_PENDING="oftabal_qr_pending_turso_v22",Q_CACHE="oftabal_qr_server_cache_turso_v22";
const C_BACKUP="oftabal_cash_local_backup_v22",C_PENDING="oftabal_cash_pending_turso_v22",C_CACHE="oftabal_cash_server_cache_turso_v22";
let settings=loadSettings(),cashRecords=[],qrRecords=[],pendingQr=null,deleteTarget=null,syncing=false;
const $=x=>document.getElementById(x),money=n=>Number(n||0).toLocaleString("cs-CZ")+" Kč",fmt=x=>new Date(x).toLocaleString("cs-CZ");
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function loadSettings(){try{return Object.assign({iban:DEFAULT_IBAN},JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}"))}catch{return{iban:DEFAULT_IBAN}}}
function store(k,a){localStorage.setItem(k,JSON.stringify(a||[]))} function load(k){try{let a=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(a)?a:[]}catch{return[]}}
async function turso(sql,args=[]){const res=await fetch(TURSO_URL+"/v2/pipeline",{method:"POST",headers:{"Authorization":"Bearer "+TURSO_TOKEN,"Content-Type":"application/json"},body:JSON.stringify({requests:[{type:"execute",stmt:{sql,args:args.map(v=>({type:v===null?"null":typeof v==="number"?"integer":"text",value:v===null?null:String(v)}))}},{type:"close"}]})});if(!res.ok)throw Error("Turso HTTP "+res.status);const j=await res.json(),r=j.results?.[0];if(r?.type==="error")throw Error(r.error?.message||"Turso chyba");return r?.response?.result||{cols:[],rows:[]}}
function rows(r){const c=(r.cols||[]).map(x=>x.name);return(r.rows||[]).map(row=>Object.fromEntries(row.map((v,i)=>[c[i],v?.value??null])))}
async function ensure(){await turso(`CREATE TABLE IF NOT EXISTS oftabal_hotovost(id TEXT PRIMARY KEY,patient TEXT NOT NULL,service TEXT NOT NULL,amount INTEGER NOT NULL,note TEXT,date TEXT NOT NULL)`);await turso(`CREATE TABLE IF NOT EXISTS oftabal_qr(id TEXT PRIMARY KEY,patient TEXT NOT NULL,service TEXT NOT NULL,amount INTEGER NOT NULL,note TEXT,vs TEXT NOT NULL,mode TEXT NOT NULL,status TEXT NOT NULL,due_date TEXT,date TEXT NOT NULL,paid_at TEXT)`)}
function setMode(m){$("cashSection").style.display=m==="cash"?"block":"none";$("qrSection").style.display=m==="qr"?"block":"none";$("tabCash").classList.toggle("active",m==="cash");$("tabQr").classList.toggle("active",m==="qr")}
function recalc(p){const [s,a]=$(p+"Service").value.split("|"),el=$(p+"Amount");el.readOnly=s!=="Jiný";el.value=s==="Jiný"?"":a} recalc("q");
function showStatus(msg){$("status").textContent=msg;$("status").style.display=msg?"block":"none"}
function updateAccount(){let x=(settings.iban||"").replace(/\s/g,"").toUpperCase();$("account").className="account"+(x===DEFAULT_IBAN?"":" warning");$("account").textContent=x===DEFAULT_IBAN?"OFTABAL s.r.o. – Česká spořitelna: "+DEFAULT_ACCOUNT:"⚠ JINÝ ÚČET: "+(settings.iban||"nenastaven")}
function queue(type,r){let k=type==="cash"?C_PENDING:Q_PENDING,a=load(k),i=a.findIndex(x=>x.id===r.id);if(i>=0)a[i]=r;else a.push(r);store(k,a)}
function merged(type){let ck=type==="cash"?C_CACHE:Q_CACHE,pk=type==="cash"?C_PENDING:Q_PENDING,m=new Map(load(ck).map(r=>[r.id,r]));load(pk).forEach(r=>{if(r.deletedPendingSync)m.delete(r.id);else m.set(r.id,r)});return [...m.values()].sort((a,b)=>new Date(b.date)-new Date(a.date))}
function backup(type,r){let k=type==="cash"?C_BACKUP:Q_BACKUP,a=load(k);a.unshift(r);store(k,a.slice(0,200))}
async function saveCash(r){await turso(`INSERT INTO oftabal_hotovost(id,patient,service,amount,note,date) VALUES(?,?,?,?,?,?) ON CONFLICT(id) DO UPDATE SET patient=excluded.patient,service=excluded.service,amount=excluded.amount,note=excluded.note,date=excluded.date`,[r.id,r.patient,r.service,r.amount,r.note||"",r.date])}
async function saveQr(r){await turso(`INSERT INTO oftabal_qr(id,patient,service,amount,note,vs,mode,status,due_date,date,paid_at) VALUES(?,?,?,?,?,?,?,?,?,?,?) ON CONFLICT(id) DO UPDATE SET patient=excluded.patient,service=excluded.service,amount=excluded.amount,note=excluded.note,vs=excluded.vs,mode=excluded.mode,status=excluded.status,due_date=excluded.due_date,date=excluded.date,paid_at=excluded.paid_at`,[r.id,r.patient,r.service,r.amount,r.note||"",r.vs,r.mode,r.status,r.due_date||"",r.date,r.paid_at||""])}
async function syncPending(){if(syncing||!navigator.onLine)return;syncing=true;try{await ensure();for(const type of ["cash","qr"]){let k=type==="cash"?C_PENDING:Q_PENDING,remain=[];for(const r of load(k)){try{if(r.deletedPendingSync)await turso(`DELETE FROM ${type==="cash"?"oftabal_hotovost":"oftabal_qr"} WHERE id=?`,[r.id]);else type==="cash"?await saveCash(r):await saveQr(r)}catch(e){remain.push(r)}}store(k,remain)}await loadAll()}catch(e){showStatus("⚠ Offline / změny čekají na synchronizaci")}finally{syncing=false}}
async function loadAll(){if(!navigator.onLine){cashRecords=merged("cash");qrRecords=merged("qr");showStatus("⚠ Pracuji offline – změny se uloží později");renderRecent();return}try{await ensure();let c=rows(await turso("SELECT * FROM oftabal_hotovost ORDER BY date DESC LIMIT 500")).map(r=>({...r,amount:Number(r.amount)}));let q=rows(await turso("SELECT * FROM oftabal_qr ORDER BY date DESC LIMIT 500")).map(r=>({...r,amount:Number(r.amount)}));store(C_CACHE,c);store(Q_CACHE,q);cashRecords=merged("cash");qrRecords=merged("qr");showStatus(load(C_PENDING).length||load(Q_PENDING).length?"⚠ Některé změny čekají na synchronizaci":"");renderRecent()}catch(e){cashRecords=merged("cash");qrRecords=merged("qr");showStatus("⚠ Databáze není dostupná – pracuji lokálně");renderRecent()}}
function recentHtml(a,type){if(!a.length)return '<div class="recent-row"><div class="muted">Zatím žádná transakce</div></div>';return a.slice(0,3).map(r=>`<div class="recent-row"><div class="recent-main"><b>${esc(r.patient)}</b> · ${money(r.amount)}${type==="qr"?` · ${r.mode==="LATER"?"Převod":"QR"} · VS ${esc(r.vs)}`:""}<div class="muted">${fmt(r.date)} · ${esc(r.service)}</div></div><button class="del" onclick="askDelete('${type}','${r.id}')">Smazat</button></div>`).join("")}
function renderRecent(){let combined=[...cashRecords.map(r=>({...r,_type:"cash"})),...qrRecords.map(r=>({...r,_type:"qr"}))].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,3);$("qrRecent").innerHTML=combined.length?combined.map(r=>`<div class="recent-row"><div class="recent-main"><b>${esc(r.patient)}</b> · ${money(r.amount)} · ${r._type==="qr"?(r.mode==="LATER"?"Převod":"QR") : "Hotově"}${r._type==="qr"?` · VS ${esc(r.vs)}`:""}<div class="muted">${fmt(r.date)} · ${esc(r.service)}</div></div><button class="del" onclick="askDelete('${r._type}','${r.id}')">Smazat</button></div>`).join(""):`<div class="recent-row"><div class="muted">Zatím žádná transakce</div></div>`}
function toggleRecent(type){let el=$(type+"Recent"),arrow=$(type+"Arrow"),open=el.classList.toggle("show");arrow.textContent=open?"⌄":"›"}
function askDelete(type,id){let a=type==="cash"?cashRecords:qrRecords,r=a.find(x=>String(x.id)===String(id));if(!r)return;deleteTarget={type,id};$("confirmText").innerHTML=`<b>${esc(r.patient)}</b><br><b>${money(r.amount)}</b><br><span class="muted">${fmt(r.date)} · ${esc(r.service)}</span>`;$("confirmOverlay").classList.add("show")}
function closeConfirm(){deleteTarget=null;$("confirmOverlay").classList.remove("show")}
async function deleteRecord(type,r){backup(type,r);if(!navigator.onLine){queue(type,{...r,deletedPendingSync:true});return}try{await turso(`DELETE FROM ${type==="cash"?"oftabal_hotovost":"oftabal_qr"} WHERE id=?`,[r.id])}catch(e){queue(type,{...r,deletedPendingSync:true})}}
async function confirmDelete(){if(!deleteTarget)return;let t=deleteTarget,a=t.type==="cash"?cashRecords:qrRecords,r=a.find(x=>String(x.id)===String(t.id));if(!r)return;await deleteRecord(t.type,r);closeConfirm();await loadAll()}
async function insert(type,r){backup(type,r);if(!navigator.onLine){queue(type,r);return}try{await ensure();type==="cash"?await saveCash(r):await saveQr(r)}catch(e){queue(type,r)}}
async function cashPayUnified(){if(!$("qPatient").value.trim())return alert("Vyplň pacienta.");if(!Number($("qAmount").value))return alert("Vyplň částku.");let r={id:uid(),patient:$("qPatient").value.trim(),service:$("qService").value.split("|")[0],amount:Number($("qAmount").value),note:$("qNote").value.trim(),date:new Date().toISOString()};await insert("cash",r);printCash(r);$("qPatient").value="";$("qNote").value="";$("qService").selectedIndex=0;recalc("q");await loadAll()}
async function cashPay(){if(!$("cPatient").value.trim())return alert("Vyplň pacienta.");if(!Number($("cAmount").value))return alert("Vyplň částku.");let r={id:uid(),patient:$("cPatient").value.trim(),service:$("cService").value.split("|")[0],amount:Number($("cAmount").value),note:$("cNote").value.trim(),date:new Date().toISOString()};await insert("cash",r);printCash(r);$("cPatient").value="";$("cNote").value="";$("cService").selectedIndex=0;recalc("c");await loadAll()}
function printCash(r){let h=`<div style="font-family:Arial;text-align:center;padding:10px"><b>OFTABAL s.r.o.</b><br>Praha 10, Plaňanská 1<br>IČO: 29415209<br><br><b>HOTOVOSTNÍ DOKLAD</b><br><b>Datum:</b> ${esc(fmt(r.date))}<hr><b>Pacient:</b> ${esc(r.patient)}<br><b>Výkon:</b> ${esc(r.service)}<br><div style="font-size:28px;font-weight:bold;margin:12px">${money(r.amount)}</div><b>Forma úhrady:</b> Hotově<br>${r.note?`<hr>${esc(r.note)}`:""}<br><small>Vyšetření nehrazené z veřejného zdravotního pojištění</small></div>`;let w=window.open("","_blank");if(!w)return alert("Povol vyskakovací okna pro tisk.");w.document.write(`<html><head><meta charset="UTF-8"><style>@page{size:58mm auto;margin:0}body{margin:0}</style></head><body>${h}</body></html>`);w.document.close();setTimeout(()=>w.print(),200)}
function nextVs(){return Math.floor(100000+Math.random()*900000).toString()}function plus14(){let d=new Date();d.setDate(d.getDate()+14);return d.toISOString().slice(0,10)}
function startQr(mode){if(!$("qPatient").value.trim())return alert("Vyplň prosím pacienta.");if(!Number($("qAmount").value))return alert("Vyplň prosím částku.");pendingQr={id:uid(),patient:$("qPatient").value.trim(),note:$("qNote").value.trim(),service:$("qService").value.split("|")[0],amount:Number($("qAmount").value),vs:nextVs(),mode,status:mode==="NOW"?"PAID":"WAITING",due_date:mode==="LATER"?plus14():"",date:new Date().toISOString(),paid_at:mode==="NOW"?new Date().toISOString():""};let spd=`SPD*1.0*ACC:${settings.iban}*AM:${pendingQr.amount.toFixed(2)}*CC:CZK*X-VS:${pendingQr.vs}`;$("qrcode").innerHTML="";new QRCode($("qrcode"),{text:spd,width:190,height:190});$("qrAmount").textContent=money(pendingQr.amount);$("qrVs").textContent="VS "+pendingQr.vs;$("qrPatient").textContent=pendingQr.patient;$("qrService").textContent=pendingQr.service;$("qrAmount2").textContent=money(pendingQr.amount);$("qrVs2").textContent=pendingQr.vs;$("dueRow").style.display=mode==="LATER"?"flex":"none";$("qrDue").textContent=pendingQr.due_date;$("qrTitle").textContent=mode==="LATER"?"Platba převodem":"QR platba";$("qrConfirm").textContent=mode==="LATER"?"Vystavit":"Zaplaceno";$("qrOverlay").classList.add("show")}
function closeQr(){$("qrOverlay").classList.remove("show")}
async function confirmQr(){if(!pendingQr)return;let r=pendingQr;await insert("qr",r);printQr(r);pendingQr=null;closeQr();$("qPatient").value="";$("qNote").value="";$("qService").selectedIndex=0;recalc("q");await loadAll()}
function printQr(r){let el=$("qrcode"),img=el.querySelector("img")?el.querySelector("img").src:el.querySelector("canvas").toDataURL();let h=`<html><head><meta charset="UTF-8"><style>@page{size:58mm auto;margin:3mm}body{font-family:Arial;text-align:center;margin:0;font-size:12px}img{width:190px}.big{font-size:26px;font-weight:bold;margin:8px}</style></head><body><b>OFTABAL s.r.o.</b><br><small>Výkon nehrazený ZP</small><br><br><img src="${img}"><div class="big">${money(r.amount)}</div><b>VS:</b> ${esc(r.vs)}<br><b>Účet:</b> ${DEFAULT_ACCOUNT}${r.due_date?`<br><b>Splatnost:</b> ${r.due_date}`:""}<br><br>${esc(r.patient)}</body></html>`;let w=window.open("","_blank");w.document.write(h);w.document.close();setTimeout(()=>w.print(),300)}
function openAdmin(){$("adminOverlay").classList.add("show");$("pinBox").style.display="";$("adminBox").style.display="none";$("pin").value="";$("pinMsg").textContent=""}function closeAdmin(){$("adminOverlay").classList.remove("show")}
function unlockAdmin(){if($("pin").value!==PIN){$("pinMsg").textContent="Neplatný PIN.";return}$("pinBox").style.display="none";$("adminBox").style.display="block";adminHistory("cash")}
function adminHistory(type){let a=type==="cash"?cashRecords:qrRecords;$("adminHistory").innerHTML=a.length?a.map(r=>`<div class="histrow"><div><b>${esc(r.patient)}</b> · ${money(r.amount)} · ${esc(r.service)}${type==="qr"?` · VS ${esc(r.vs)} · ${r.mode==="LATER"?"Převod":"QR"}`:""}<br><span class="muted">${fmt(r.date)}</span></div><button class="del" onclick="askDelete('${type}','${r.id}')">Smazat</button></div>`).join(""):'<div class="histrow">Bez historie</div>'}
function exportCsv(type){let a=type==="cash"?cashRecords:qrRecords;if(!a.length)return alert("Není co exportovat.");let head=type==="cash"?"Datum;Pacient;Výkon;Částka;Poznámka\n":"Datum;Pacient;Výkon;Částka;VS;Stav;Splatnost;Poznámka\n";let csv="\uFEFF"+head+a.map(r=>(type==="cash"?[fmt(r.date),r.patient,r.service,r.amount,r.note||""]:[fmt(r.date),r.patient,r.service,r.amount,r.vs,r.status,r.due_date||"",r.note||""]).map(v=>`"${String(v).replaceAll('"','""')}"`).join(";")).join("\n");download(new Blob([csv],{type:"text/csv;charset=utf-8"}),type==="cash"?"OFTABAL_HOTOVOST.csv":"OFTABAL_QR.csv")}
function cashBook(){let d=new Date(),m=prompt("Měsíc (1-12):",d.getMonth()+1),y=prompt("Rok:",d.getFullYear());if(!m||!y)return;let a=cashRecords.filter(r=>{let x=new Date(r.date);return x.getMonth()+1==m&&x.getFullYear()==y}),total=a.reduce((s,r)=>s+Number(r.amount),0),w=window.open("","_blank");w.document.write(`<html><head><meta charset="UTF-8"></head><body style="font-family:Arial"><h2>HOTOVOSTNÍ POKLADNÍ KNIHA – OFTABAL ${String(m).padStart(2,"0")}/${y}</h2><table border="1" cellspacing="0" cellpadding="5" style="border-collapse:collapse;width:100%"><tr><th>Datum</th><th>Pacient</th><th>Výkon</th><th>Poznámka</th><th>Kč</th></tr>${a.map(r=>`<tr><td>${esc(fmt(r.date))}</td><td>${esc(r.patient)}</td><td>${esc(r.service)}</td><td>${esc(r.note||"")}</td><td>${r.amount}</td></tr>`).join("")}</table><h3>Celkem: ${money(total)}</h3><button onclick="window.print()">TISK</button></body></html>`);w.document.close()}
function openSetup(){$("iban").value=settings.iban;$("setupOverlay").classList.add("show")}function closeSetup(){$("setupOverlay").classList.remove("show")}function saveSetup(){let x=$("iban").value.replace(/\s/g,"").toUpperCase();if(!x)return;if(x!==(settings.iban||"").replace(/\s/g,"").toUpperCase()&&!confirm("Měníte účet pro QR platby.\n\nPokračovat?"))return;settings.iban=x;localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));updateAccount();closeSetup()}
function download(blob,name){let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function backupQr(){let a=qrRecords;if(!a.length)return alert("Není co zálohovat.");let csv="\uFEFFPacient;Poznámka;Výkon;Cena;VS;Stav;Splatnost;Datum\n"+a.map(r=>[r.patient,r.note||"",r.service,r.amount,r.vs,r.status,r.due_date||"",fmt(r.date)].map(v=>`"${String(v).replaceAll('"','""')}"`).join(";")).join("\n");download(new Blob([csv],{type:"text/csv;charset=utf-8"}),"oftabal_qr_backup_"+new Date().toISOString().slice(0,10)+".csv")}
function qrReceipt(r){return `<div style="padding:26px;font-family:Arial"><h2>OFTABAL s.r.o.</h2><div>Plaňanská 1, Praha 10 | IČO 29415209</div><hr><b>Pacient:</b> ${esc(r.patient)}<br><b>Výkon:</b> ${esc(r.service)}<br><h2>${money(r.amount)}</h2><b>VS:</b> ${esc(r.vs)}<br>${r.due_date?`<b>Splatnost:</b> ${esc(r.due_date)}<br>`:""}<small>Vyšetření nehrazené z veřejného zdravotního pojištění</small></div>`}
async function exportQrZip(){if(!qrRecords.length)return alert("Není co exportovat.");let zip=new JSZip();for(const r of qrRecords){let w=document.createElement("div");w.style.width="700px";w.innerHTML=qrReceipt(r);let pdf=await html2pdf().set({margin:10,html2canvas:{scale:2},jsPDF:{unit:"mm",format:"a4"}}).from(w).outputPdf("blob");zip.file(`QR/${r.vs}.pdf`,pdf)}download(await zip.generateAsync({type:"blob"}),"oftabal_qr_export_"+new Date().toISOString().slice(0,10)+".zip")}
window.addEventListener("online",syncPending);window.addEventListener("offline",()=>showStatus("⚠ Pracuji offline – změny se uloží později"));setTimeout(syncPending,5000);setTimeout(syncPending,15000);setInterval(syncPending,5*60*1000);setInterval(()=>{if(load(C_PENDING).length||load(Q_PENDING).length)syncPending()},60000);
updateAccount();loadAll();syncPending();
</script>
